<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Student Management System</h1>
            <p>Manage student records efficiently</p>
        </div>

        <div class="content">
            <div class="section">
                <h2>Add New Student</h2>
                <form id="addForm">
                    <div class="form-group">
                        <label for="id">Student ID:</label>
                        <input type="number" id="id" required>
                    </div>
                    <div class="form-group">
                        <label for="name">Name:</label>
                        <input type="text" id="name" required>
                    </div>
                    <div class="form-group">
                        <label for="course">Course:</label>
                        <input type="text" id="course" required>
                    </div>
                    <div class="form-group">
                        <label for="marks">Marks:</label>
                        <input type="number" id="marks" step="0.01" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Student</button>
                </form>
            </div>

            <div class="section">
                <h2>Search Student</h2>
                <div class="search-group">
                    <input type="number" id="searchId" placeholder="Enter Student ID to search">
                    <button onclick="searchStudent()" class="btn btn-secondary">Search</button>
                </div>
                <div id="searchResult" class="result"></div>
            </div>

            <div class="section">
                <h2>Update Student</h2>
                <div class="update-group">
                    <input type="number" id="updateId" placeholder="Enter Student ID to update">
                    <button onclick="loadForUpdate()" class="btn btn-secondary">Load</button>
                </div>
                <form id="updateForm" style="display:none;">
                    <div class="form-group">
                        <label for="updateName">Name:</label>
                        <input type="text" id="updateName">
                    </div>
                    <div class="form-group">
                        <label for="updateCourse">Course:</label>
                        <input type="text" id="updateCourse">
                    </div>
                    <div class="form-group">
                        <label for="updateMarks">Marks:</label>
                        <input type="number" id="updateMarks" step="0.01">
                    </div>
                    <button type="submit" class="btn btn-primary">Update Student</button>
                    <button type="button" onclick="cancelUpdate()" class="btn btn-danger">Cancel</button>
                </form>
            </div>

            <div class="section">
                <h2>Delete Student</h2>
                <div class="delete-group">
                    <input type="number" id="deleteId" placeholder="Enter Student ID to delete">
                    <button onclick="deleteStudent()" class="btn btn-danger">Delete</button>
                </div>
            </div>

            <div class="section">
                <h2>All Students</h2>
                <button onclick="viewAllStudents()" class="btn btn-secondary">Refresh List</button>
                <div id="studentList" class="student-list"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
